name: yijing-dev

services:
  supabase-proxy:
    image: caddy:2-alpine
    container_name: yijing-supabase-proxy
    restart: unless-stopped
    environment:
      SUPABASE_UPSTREAM_URL: ${SUPABASE_UPSTREAM_URL}
    ports:
      - "64321:8080"
    volumes:
      - ./infra/dev/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - functions

  functions:
    image: denoland/deno:1.46.3
    container_name: yijing-functions-dev
    restart: unless-stopped
    environment:
      PORT: "8000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    working_dir: /home/deno/functions/main
    command:
      - deno
      - run
      - --allow-net
      - --allow-env
      - --allow-read
      - --watch
      - index.ts
    volumes:
      - ./infra/supabase/volumes/functions/main:/home/deno/functions/main
      - yijing_deno_cache:/root/.cache/deno

  web:
    image: node:22-bookworm-slim
    container_name: yijing-web-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
      VITE_SUPABASE_URL: "http://localhost:64321"
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - yijing_node_modules:/app/node_modules
    command: >
      sh -lc "if [ ! -f node_modules/.bin/vite ]; then npm ci; fi &&
      npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - supabase-proxy

volumes:
  yijing_node_modules:
  yijing_deno_cache:

